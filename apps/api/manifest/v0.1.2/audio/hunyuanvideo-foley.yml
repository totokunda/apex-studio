api_version: apex/v1
kind: Model
type: audio
metadata:
  id: hunyuanvideo-foley
  model: hunyuanvideo
  name: HunyuanVideo-Foley
  version: 0.1.2
  description: Generate high-fidelity 48kHz Foley audio from a video and a text prompt.
  tags:
  - hunyuanvideo
  - foley
  - video-to-audio
  author: Tencent
  license: Tencent Hunyuan Community License Agreement
  homepage: https://huggingface.co/tencent/HunyuanVideo-Foley
  categories:
  - video-to-audio
spec:
  engine: hunyuanvideo
  model_type: foley
  engine_type: torch
  compute_requirements:
    min_cuda_compute_capability: 7.5
    supported_compute_types:
    - cuda
    - metal
    - cpu
  defaults:
    guidance_scale: 4.5
    num_inference_steps: 50
    offload: true
  components:
  - type: scheduler
    name: scheduler
    label: HunyuanVideo-Foley Scheduler
    default: EulerFlowScheduler
    scheduler_manifest: schedulers/flow_matching.yml
    scheduler_config_defaults:
      num_train_timesteps: 1000
      shift: 1.0
      sigma_max: 1.0
      sigma_min: 0.002994011976047904
    
  - type: transformer
    name: foley_model
    label: HunyuanVideo-Foley Diffusion Model
    base: hunyuanvideo.foley
    config_id: HunyuanVideo-Foley/transformer
    model_path:
    - path: totoku/apex-models/HunyuanVideo-Foley/transformer/transformer-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
    - path: totoku/apex-models/HunyuanVideo-Foley/transformer/transformer-fp8_e4m3fn.safetensors
      variant: FP8_E4M3FN
      precision: fp8
      type: safetensors
    - path: totoku/apex-models/HunyuanVideo-Foley/transformer/transformer-q8_0.gguf
      variant: GGUF_Q8_0
      precision: q8_0
      type: gguf
    - path: totoku/apex-models/HunyuanVideo-Foley/transformer/transformer-q6_k.gguf
      variant: GGUF_Q6_K
      precision: q6_k
      type: gguf
    - path: totoku/apex-models/HunyuanVideo-Foley/transformer/transformer-q4_k_m.gguf
      variant: GGUF_Q4_K_M
      precision: q4_k_m
      type: gguf
  - type: vae
    name: dac_model
    label: DAC VAE 128d 48kHz
    base: dac
    config_id: HunyuanVideo-Foley/vae
    model_path:
    - path: totoku/apex-models/HunyuanVideo-Foley/vae/vae-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
  - type: text_encoder
    name: clap_model
    label: CLAP Text Encoder
    base: ClapTextModelWithProjection
    config_id: HunyuanVideo-Foley/text_encoder
    model_path:
    - path: totoku/apex-models/HunyuanVideo-Foley/text_encoder/text_encoder-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
    tokenizer_class: RobertaTokenizer
    tokenizer_path: totoku/apex-models/HunyuanVideo-Foley/tokenizer
  - type: helper
    name: siglip_model
    label: SigLIP2 Model
    module: transformers
    base: SiglipModel
    config_id: HunyuanVideo-Foley/siglip_encoder
    model_path:
    - path: totoku/apex-models/HunyuanVideo-Foley/siglip_encoder
      variant: default
      precision: fp16
      type: safetensors
  - type: helper
    name: syncformer_model
    label: Synchformer Model
    base: hunyuanvideofoley.synchformer
    model_path:
    - path: totoku/apex-models/HunyuanVideo-Foley/syncformer_encoder
      variant: default
      precision: bf16
      type: pth
  ui:
    panels:
    - name: video
      label: Video
      collapsible: true
      default_open: true
      layout:
        flow: column
        rows:
        - - video
    - name: prompting
      label: Prompting
      collapsible: true
      default_open: true
      layout:
        flow: column
        rows:
        - - prompt
    - name: advanced_prompting
      label: Advanced Prompting
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - negative_prompt
    - name: sampling
      label: Sampling
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - num_inference_steps
        - - guidance_scale
        - - seed
    inputs:
    - id: video
      label: Video
      description: The input video to generate Foley audio from.
      type: video
      panel: video
      required: true
    - id: prompt
      label: Prompt
      description: Describe the Foley audio you want to generate for the video.
      placeholder: Crunchy footsteps on gravel, distant traffic, soft wind, and a brief metallic clink.
      type: text
      panel: prompting
      required: true
    - id: negative_prompt
      label: Negative Prompt
      description: Describe what to avoid in the audio generation.
      placeholder: noisy, harsh, distorted, clipping
      type: text
      panel: advanced_prompting
      required: false
      default: noisy, harsh
    - id: num_inference_steps
      label: Inference Steps
      description: Number of denoising steps.
      type: number+slider
      value_type: integer
      panel: sampling
      default: 50
      min: 1
      max: 100
      step: 1
      required: false
    - id: guidance_scale
      label: Guidance Scale
      description: Classifier-free guidance strength.
      type: number+slider
      value_type: float
      panel: sampling
      default: 4.5
      min: 1.0
      max: 15.0
      step: 0.5
      required: false
    - id: seed
      label: Seed
      description: Random seed for reproducibility.
      type: random
      default: -1
      min: 0
      max: 4294967295
      value_type: integer
      panel: sampling
      required: false
    - id: use_video_duration
      label: Use Video Duration
      description: Use the duration of the video to determine the number of frames.
      type: boolean
      panel: sampling
      required: false
      default: true
