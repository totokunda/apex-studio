  - id: flux-dev-krea
    label: "Flux Dev Krea"
    description: "12B parameter model specialized for image inpainting and outpainting. Seamlessly fills masked regions or extends image boundaries with context-aware content that matches lighting, style, and perspective of the surrounding image."
    manifest_ref: image/flux-krea-text-to-image
