api_version: apex/v1
kind: Model
type: image
metadata:
  id: qwenimage-t2i
  model: qwenimage
  name: QwenImage Text-to-Image
  version: 0.1.2
  description: QwenImage is a 20B parameter model for text-to-image generation.
  tags:
  - qwenimage
  - t2i
  author: Qwen
  license: Apache-2.0
  demo_path: models/qwenimage.jpg
  categories:
  - text-to-image
spec:
  engine: qwenimage
  model_type: t2i
  engine_type: torch
  denoise_type: base
  compute_requirements:
    min_cuda_compute_capability: 7.0
    supported_compute_types:
    - cuda
    - cpu
    - metal
  attention_types:
  - sdpa
  - flash
  - flash3
  - sage
  - metal_flash
  - efficient_dot_product_attention
  - xformers
  components:
  - type: scheduler
    label: Scheduler
    default: EulerFlowScheduler
    scheduler_manifest: schedulers/flow_matching.yml
    scheduler_config_defaults:
      num_train_timesteps: 1000
      shift: 1.0
      sigma_max: 1.0
      sigma_min: 0.002994011976047904
  - type: vae
    label: QwenImage VAE
    base: qwenimage
    config_id: Qwen-Image/vae
    model_path:
    - path: totoku/apex-models/Qwen-Image/vae/vae-bf16.safetensors
      variant: default
      precision: fp16
      type: safetensors
      file_size: 253806966
      resource_requirements:
        min_vram_gb: 8
        recommended_vram_gb: 12
  - type: text_encoder
    label: Qwen2.5 VL Text Encoder
    base: Qwen2_5_VLForConditionalGeneration
    config_id: Qwen-Image/text_encoder
    gguf_kwargs:
      key_map: qwen_vl
    model_path:
    - path: totoku/apex-models/Qwen-Image/text_encoder/text_encoder-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 16584415576
      resource_requirements:
        min_vram_gb: 19
        recommended_vram_gb: 26
    - path: totoku/apex-models/Qwen-Image/text_encoder/text_encoder-fp8_e4m3fn.safetensors
      variant: FP8
      precision: fp8_e4m3fn
      type: safetensors
      file_size: 8839637196
      resource_requirements:
        min_vram_gb: 15
        recommended_vram_gb: 20
    - path: totoku/apex-models/Qwen-Image/text_encoder/text_encoder-q8_0.gguf
      variant: Q8
      precision: q8_0
      type: gguf
      file_size: 9452685216
      resource_requirements:
        min_vram_gb: 14
        recommended_vram_gb: 19
    tokenizer_class: Qwen2Tokenizer
    tokenizer_name: totoku/apex-models
    tokenizer_kwargs:
      subfolder: Qwen-Image/tokenizer
  - type: transformer
    label: QwenImage Transformer
    base: qwenimage.base
    config_id: Qwen-Image/transformer
    model_path:
    - path: totoku/apex-models/Qwen-Image/transformer/transformer-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 40861031488
      resource_requirements:
        min_vram_gb: 35
        recommended_vram_gb: 47
    - path: totoku/apex-models/Qwen-Image/transformer/transformer-fp8_e4m3fn.safetensors
      variant: FP8
      precision: fp8_e4m3fn
      type: safetensors
      file_size: 20476801832
      resource_requirements:
        min_vram_gb: 24
        recommended_vram_gb: 32
    - path: totoku/apex-models/Qwen-Image/transformer/transformer-q8_0.gguf
      variant: Q8
      precision: q8_0
      type: gguf
      file_size: 21750652384
      resource_requirements:
        min_vram_gb: 22
        recommended_vram_gb: 30
    - path: totoku/apex-models/Qwen-Image/transformer/transformer-q6_k.gguf
      variant: Q6
      precision: q6_k
      type: gguf
      file_size: 16813825504
      resource_requirements:
        min_vram_gb: 15
        recommended_vram_gb: 20
    - path: totoku/apex-models/Qwen-Image/transformer/transformer-q4_k_m.gguf
      variant: Q4
      precision: q4_k_m
      type: gguf
      file_size: 11558493664
      resource_requirements:
        min_vram_gb: 9
        recommended_vram_gb: 13
  defaults:
    run:
      num_inference_steps: 30
      return_latents: false
      text_encoder_kwargs:
        add_special_tokens: false
        clean_text: false
      attention_kwargs: {}
  ui:
    panels:
    - name: prompting
      label: Prompting
      collapsible: true
      default_open: true
      layout:
        flow: column
        rows:
        - - prompt
    - name: advanced_prompting
      label: Advanced Prompting
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - negative_prompt
    - name: size
      label: Size
      collapsible: true
      default_open: true
      layout:
        flow: column
        rows:
        - - resolution
        - - aspect_ratio
        - - height
          - width
    - name: sampling
      label: Sampling
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - num_inference_steps
        - - true_cfg_scale
        - - guidance_scale
        - - seed
    inputs:
    - id: prompt
      label: Prompt
      description: The prompt for text-to-image generation.
      placeholder: A serene lake surrounded by pine trees at sunrise, ultra realistic.
      type: text
      panel: prompting
      required: true
    - id: negative_prompt
      label: Negative Prompt
      description: Describe what you want to avoid in the generation.
      placeholder: blurry, low quality, distorted, artifacts
      type: text
      panel: advanced_prompting
      required: false
      default: ' '
    - id: resolution
      label: Resolution
      description: Select the resolution of the output image
      panel: size
      type: select
      default: 720
      options:
      - name: HD
        value: 720
      - name: Ultra HD
        value: 1024
      - name: SD
        value: 480
      - name: Custom
        value: custom
    - id: aspect_ratio
      label: Aspect Ratio
      description: Select the aspect ratio of the output image
      panel: size
      type: select
      default: '16:9'
      options:
      - name: Wide
        value: '16:9'
        ratio_w: 16
        ratio_h: 9
      - name: Vertical
        value: '9:16'
        ratio_w: 9
        ratio_h: 16
      - name: Square
        value: '1:1'
        ratio_w: 1
        ratio_h: 1
      - name: Classic
        value: '4:3'
        ratio_w: 4
        ratio_h: 3
      - name: Custom
        value: custom
    - id: num_inference_steps
      label: Inference Steps
      description: Number of denoising steps
      type: number+slider
      value_type: integer
      panel: sampling
      default: 4
      min: 1
      max: 100
      step: 1
    - id: height
      label: Height
      description: Explicit height override
      type: number
      value_type: integer
      panel: size
      default: 1024
      min: 256
      max: 8192
      step: 16
    - id: width
      label: Width
      description: Explicit width override
      type: number
      value_type: integer
      panel: size
      default: 1024
      min: 256
      max: 8192
      step: 16
    - id: seed
      label: Seed
      description: Random seed for reproducibility
      type: random
      default: -1
      min: 0
      max: 4294967295
      value_type: integer
      panel: sampling
      required: false
    - id: true_cfg_scale
      label: True CFG Scale
      type: number+slider
      value_type: float
      panel: sampling
      required: false
      default: 4.0
      min: 1.0
      max: 15.0
      step: 0.5
