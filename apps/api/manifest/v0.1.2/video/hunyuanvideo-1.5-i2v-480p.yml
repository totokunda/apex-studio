api_version: apex/v1
kind: Model
type: video
metadata:
  id: hunyuanvideo15-i2v-480p
  model: hunyuanvideo15
  name: HunyuanVideo 1.5 Image-to-Video 480p
  version: 0.1.2
  description: HunyuanVideo 1.5 is a 8.3B parameter model for text/image-to-video
    generation at 480p resolution.
  tags:
  - hunyuanvideo15
  - i2v
  author: Tencent
  license: Apache-2.0
  demo_path: models/hunyuan-video-15-i2v-480p.mp4
  categories:
  - image-to-video
spec:
  engine: hunyuanvideo15
  model_type: i2v
  engine_type: torch
  default_duration_secs: 5.0
  fps: 24
  compute_requirements:
    min_cuda_compute_capability: 7.5
    supported_compute_types:
    - cuda
    - cpu
    - metal
  attention_types:
  - sdpa
  - flash
  - sage
  - flash3
  - metal_flash
  - efficient_dot_product_attention
  components:
  - type: scheduler
    label: Scheduler
    default: EulerFlowScheduler
    scheduler_manifest: schedulers/flow_matching.yml
    scheduler_config_defaults:
      num_train_timesteps: 1000
      shift: 7.0
      sigma_max: 1.0
      sigma_min: 0.002994011976047904
  - type: vae
    label: HunyuanImage VAE
    base: hunyuanvideo15
    config_id: HunyuanVideo-1.5/vae
    model_path:
    - path: totoku/apex-models/HunyuanVideo-1.5/vae/vae-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 2521294886
      resource_requirements:
        min_vram_gb: 12
        recommended_vram_gb: 16
    config:
      light_vae_path: totoku/apex-models/HunyuanVideo-1.5/vae/lightvae-bf16.safetensors
  - type: text_encoder
    label: Qwen2.5 VL Text Encoder
    base: Qwen2_5_VLForConditionalGeneration
    config_id: Qwen-Image/text_encoder
    gguf_kwargs:
      key_map: qwen_vl
    model_path:
    - path: totoku/apex-models/Qwen-Image/text_encoder/text_encoder-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 16584415576
      resource_requirements:
        min_vram_gb: 21
        recommended_vram_gb: 28
    - path: totoku/apex-models/Qwen-Image/text_encoder/text_encoder-fp8_e4m3fn.safetensors
      variant: FP8_E4M3FN
      precision: fp8_e4m3fn
      type: safetensors
      file_size: 8839637196
      resource_requirements:
        min_vram_gb: 17
        recommended_vram_gb: 23
    - path: totoku/apex-models/Qwen-Image/text_encoder/text_encoder-q8_0.gguf
      variant: GGUF_Q8_0
      precision: q8_0
      type: gguf
      file_size: 9452685216
      resource_requirements:
        min_vram_gb: 16
        recommended_vram_gb: 22
    tokenizer_class: Qwen2Tokenizer
    tokenizer_name: totoku/apex-models
    tokenizer_kwargs:
      subfolder: Qwen-Image/tokenizer
  - type: transformer
    label: HunyuanVideo Transformer
    base: hunyuanvideo15.base
    config_id: HunyuanVideo-1.5-I2V/transformer
    model_path:
    - path: totoku/apex-models/HunyuanVideo-1.5-I2V/transformer_480p/transformer-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 16653430048
      resource_requirements:
        min_vram_gb: 21
        recommended_vram_gb: 28
    - path: totoku/apex-models/HunyuanVideo-1.5-I2V/transformer_480p/transformer-fp8_e4m3fn.safetensors
      variant: FP8_E4M3FN
      precision: fp8_e4m3fn
      type: safetensors
      file_size: 8499784912
      resource_requirements:
        min_vram_gb: 16
        recommended_vram_gb: 22
    - path: totoku/apex-models/HunyuanVideo-1.5-I2V/transformer_480p/transformer-q8_0.gguf
      variant: GGUF_Q8_0
      precision: q8_0
      type: gguf
      file_size: 9009236896
      resource_requirements:
        min_vram_gb: 16
        recommended_vram_gb: 22
    - path: totoku/apex-models/HunyuanVideo-1.5-I2V/transformer_480p/transformer-q6_k.gguf
      variant: GGUF_Q6_K
      precision: q6_k
      type: gguf
      file_size: 7034506144
      resource_requirements:
        min_vram_gb: 13
        recommended_vram_gb: 18
    - path: totoku/apex-models/HunyuanVideo-1.5-I2V/transformer_480p/transformer-q4_k_m.gguf
      variant: GGUF_Q4_K_M
      precision: q4_k_m
      type: gguf
      file_size: 4932373408
      resource_requirements:
        min_vram_gb: 11
        recommended_vram_gb: 15
  - type: helper
    label: HunyuanVideo Image Encoder
    base: SiglipVisionModel
    module: transformers
    name: image_encoder
    config_id: HunyuanVideo-1.5/image_encoder
    model_path:
    - path: totoku/apex-models/HunyuanVideo-1.5/image_encoder/model.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 856506120
      resource_requirements:
        min_vram_gb: 5
        recommended_vram_gb: 9
  - type: helper
    label: HunyuanVideo Image Feature Extractor
    base: SiglipImageProcessor
    module: transformers
    name: feature_extractor
    config_id: HunyuanVideo-1.5-I2V/feature_extractor
  - type: text_encoder
    label: HunyuanVideo ByT5 Encoder
    base: T5EncoderModel
    name: text_encoder_2
    config_id: HunyuanVideo-1.5/text_encoder_2
    tokenizer_class: ByT5Tokenizer
    tokenizer_name: totoku/apex-models
    tokenizer_kwargs:
      subfolder: HunyuanVideo-1.5/tokenizer
    model_path:
    - path: totoku/apex-models/HunyuanVideo-1.5/text_encoder_2/model.safetensors
      variant: default
      precision: fp16
      type: safetensors
      file_size: 877273128
      resource_requirements:
        min_vram_gb: 9
        recommended_vram_gb: 13
  defaults:
    run:
      num_inference_steps: 50
      return_latents: false
      guidance_scale: 1.0
      attention_kwargs: {}
      chunking_profile: light
      rope_on_cpu: false
  ui:
    panels:
    - name: image
      label: Image
      collapsible: true
      default_open: true
      layout:
        flow: column
        rows:
        - - image
    - name: prompting
      label: Prompting
      collapsible: true
      default_open: true
      layout:
        flow: column
        rows:
        - - prompt
    - name: size
      label: Size
      collapsible: true
      default_open: true
      layout:
        flow: column
        rows:
        - - resolution
        - - aspect_ratio
        - - height
          - width
    - name: sampling
      label: Sampling
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - num_inference_steps
        - - guidance_scale
        - - guidance_rescale
        - - seed
    - name: chunking_profile
      label: Chunking Profile
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - chunking_profile
        - - rope_on_cpu
    inputs:
    - id: prompt
      label: Prompt
      description: The prompt for image-to-video generation.
      placeholder: A serene lake surrounded by pine trees at sunrise, ultra realistic.
      type: text
      panel: prompting
      required: true
    - id: image
      label: Image
      description: The image for image-to-video generation.
      type: image
      panel: image
      required: true
    - id: num_inference_steps
      label: Inference Steps
      description: Number of denoising steps
      type: number+slider
      value_type: integer
      panel: sampling
      default: 30
      min: 1
      max: 100
      step: 1
    - id: seed
      label: Seed
      description: Random seed for reproducibility
      type: random
      default: -1
      min: 0
      max: 4294967295
      value_type: integer
      panel: sampling
      required: false
    - id: guidance_scale
      label: Guidance Scale
      type: number+slider
      value_type: float
      panel: sampling
      required: false
      default: 4.0
      min: 0.0
      max: 10.0
      step: 0.1
    - id: guidance_rescale
      label: Guidance Rescale
      type: number+slider
      value_type: float
      panel: sampling
      required: false
      default: 0.0
      min: 0.0
      max: 1.0
      step: 0.01
    - id: resolution
      label: Resolution
      description: Select the resolution of the output image
      panel: size
      type: select
      default: 480
      options:
      - name: SD
        value: 480
      - name: HD
        value: 720
      - name: Custom
        value: custom
    - id: aspect_ratio
      label: Aspect Ratio
      description: Select the aspect ratio of the output image
      panel: size
      type: select
      default: '16:9'
      options:
      - name: Wide
        value: '16:9'
        ratio_w: 16
        ratio_h: 9
      - name: Vertical
        value: '9:16'
        ratio_w: 9
        ratio_h: 16
      - name: Square
        value: '1:1'
        ratio_w: 1
        ratio_h: 1
      - name: Classic
        value: '4:3'
        ratio_w: 4
        ratio_h: 3
      - name: Custom
        value: custom
    - id: num_inference_steps
      label: Inference Steps
      description: Number of denoising steps
      type: number+slider
      value_type: integer
      panel: sampling
      default: 30
      min: 1
      max: 100
      step: 1
    - id: height
      label: Height
      description: Explicit height override
      type: number
      value_type: integer
      panel: size
      default: 480
      min: 256
      max: 8192
      step: 16
    - id: width
      label: Width
      description: Explicit width override
      type: number
      value_type: integer
      panel: size
      default: 832
      min: 256
      max: 8192
      step: 16
    - id: chunking_profile
      label: Chunking Profile
      description: Split tensors into smaller chunks to reduce memory usage.
      type: select
      panel: chunking_profile
      default: light
      options:
      - name: None
        value: none
      - name: Light
        value: light
      - name: Balanced
        value: balanced
      - name: Aggressive
        value: aggressive
    - id: rope_on_cpu
      label: Rope Frequency on CPU
      description: Keep RoPE frequency tables on CPU to save VRAM; small slices are
        moved to GPU only when needed.
      type: boolean
      panel: chunking_profile
      default: false
      required: false
