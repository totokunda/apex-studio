api_version: apex/v1
kind: Model
type: video
metadata:
  id: wan-2-2-a5b-text-to-video
  model: wan
  name: Wan 2.2 5B Text to Video
  version: 0.1.2
  description: Wan 2.2 5B is a 5B parameter model for text-to-video generation.
  tags:
  - wan
  - t2v
  - 14b
  - '2.2'
  author: Wan-AI
  license: Apache-2.0
  demo_path: models/wan-2.2-text-to-image-to-video.mp4
  categories:
  - text-to-video
spec:
  engine: wan
  denoise_type: base
  fps: 24
  attention_types:
  - sdpa
  - flash
  - flash3
  - sage
  - metal_flash
  - efficient_dot_product_attention
  model_type: t2v
  engine_type: torch
  default_duration_secs: 5.0
  compute_requirements:
    min_cuda_compute_capability: 7.5
    supported_compute_types:
    - cuda
    - cpu
    - metal
  loras:
  - name: Wan 2.2 5B FastWan LoRA
    label: Wan 2.2 5B FastWan LoRA
    source: Kijai/WanVideo_comfy/FastWan/Wan2_2_5B_FastWanFullAttn_lora_rank_128_bf16.safetensors
    required: false
    verified: true
    scale: 1.0
    file_size: 660874456
  components:
  - type: scheduler
    label: Scheduler
    default: UniPCMultistepSchedulerBH2
    scheduler_manifest: schedulers/flow_matching.yml
    scheduler_config_defaults:
      num_train_timesteps: 1000
      shift: 5.0
      sigma_max: 1.0
      sigma_min: 0.002994011976047904
  - type: vae
    name: transformer_vae
    label: Wan VAE
    base: wan
    config_id: Wan2.2-TI2V-5B/vae
    model_path:
    - path: totoku/apex-models/Wan2.2-TI2V-5B/vae/vae-bf16.safetensors
      variant: default
      precision: fp16
      type: safetensors
      file_size: 1409400568
      resource_requirements:
        min_vram_gb: 12
        recommended_vram_gb: 16
  - type: vae
    label: Tiny Wan VAE
    name: __tiny_transformer_vae__
    base: tae
    config_id: TAE/wan-2.2-5b
    model_path:
    - path: lightx2v/Autoencoders/lighttaew2_2.safetensors
      variant: default
      precision: fp16
      type: safetensors
      file_size: 45684280
      resource_requirements:
        min_vram_gb: 11
        recommended_vram_gb: 15
  - type: text_encoder
    label: WAN Text Encoder
    base: UMT5EncoderModel
    offloading_module: encoder
    config_id: Wan2.1-T2V/text_encoder
    model_path:
    - path: totoku/apex-models/Wan2.1-T2V/text_encoder/text_encoder-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 11361851224
      resource_requirements:
        min_vram_gb: 17
        recommended_vram_gb: 23
    - path: totoku/apex-models/Wan2.1-T2V/text_encoder/text_encoder-fp8_e4m3fn.safetensors
      variant: FP8
      precision: fp8_e4m3fn
      type: safetensors
      file_size: 6731313000
      resource_requirements:
        min_vram_gb: 15
        recommended_vram_gb: 20
    - path: totoku/apex-models/Wan2.1-T2V/text_encoder/text_encoder-q8_0.gguf
      variant: Q8
      precision: q8_0
      type: gguf
      file_size: 7027437536
      resource_requirements:
        min_vram_gb: 14
        recommended_vram_gb: 19
    tokenizer_class: T5Tokenizer
    tokenizer_name: totoku/apex-models
    tokenizer_kwargs:
      subfolder: Wan2.1-T2V/tokenizer
  - type: transformer
    base: wan.base
    label: Wan 2.2 5B Transformer
    config_id: Wan2.2-TI2V-5B/transformer
    model_path:
    - path: totoku/apex-models/Wan2.2-TI2V-5B/transformer/transformer-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 9999660080
      resource_requirements:
        min_vram_gb: 16
        recommended_vram_gb: 22
    - path: totoku/apex-models/Wan2.2-TI2V-5B/transformer/transformer-fp8_e4m3fn.safetensors
      variant: FP8
      precision: fp8_e4m3fn
      type: safetensors
      file_size: 5092350248
      resource_requirements:
        min_vram_gb: 13
        recommended_vram_gb: 18
    - path: totoku/apex-models/Wan2.2-TI2V-5B/transformer/transformer-q8_0.gguf
      variant: Q8
      precision: q8_0
      type: gguf
      file_size: 5398999872
      resource_requirements:
        min_vram_gb: 13
        recommended_vram_gb: 18
    - path: totoku/apex-models/Wan2.2-TI2V-5B/transformer/transformer-q6_k.gguf
      variant: Q6
      precision: q6_k
      type: gguf
      file_size: 4210504512
      resource_requirements:
        min_vram_gb: 11
        recommended_vram_gb: 15
    - path: totoku/apex-models/Wan2.2-TI2V-5B/transformer/transformer-q4_k_m.gguf
      variant: Q4
      precision: q4_k_m
      type: gguf
      file_size: 2945332032
      resource_requirements:
        min_vram_gb: 10
        recommended_vram_gb: 14
  defaults:
    run:
      num_inference_steps: 4
      expand_timesteps: true
      guidance_scale: 1.0
      boundary_ratio: null
      return_latents: false
      text_encoder_kwargs:
        use_attention_mask: true
      attention_kwargs: {}
      vae_tile_sample_min_height: 256
      vae_tile_sample_min_width: 256
      vae_tile_sample_stride_height: 192
      vae_tile_sample_stride_width: 192
      rope_on_cpu: false
      chunking_profile: balanced
  ui:
    panels:
    - name: prompting
      label: Prompting
      collapsible: true
      default_open: true
      layout:
        flow: column
        rows:
        - - prompt
    - name: advanced_prompting
      label: Advanced Prompting
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - negative_prompt
    - name: size
      label: Size
      collapsible: true
      default_open: true
      layout:
        flow: column
        rows:
        - - resolution
        - - aspect_ratio
        - - height
          - width
    - name: sampling
      label: Sampling
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - num_inference_steps
        - - guidance_scale
        - - seed
    - name: chunking_profile
      label: Chunking Profile
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - rope_on_cpu
        - - chunking_profile
    - name: vae
      label: VAE / Memory
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - use_tiny_vae
        - - vae_tile_sample_min_height
        - - vae_tile_sample_min_width
        - - vae_tile_sample_stride_height
        - - vae_tile_sample_stride_width
    inputs:
    - id: prompt
      label: Prompt
      description: Describe the video you want to generate.
      placeholder: A beautiful landscape at golden hour.
      type: text
      panel: prompting
      required: true
    - id: negative_prompt
      label: Negative Prompt
      description: Describe the video you don't want to generate.
      placeholder: blurry, low quality, distorted, artifacts
      type: text
      panel: advanced_prompting
      required: false
      default: lowres, text, error, cropped, worst quality, low quality, jpeg artifacts, ugly, duplicate, morbid, mutilated, out of frame, extra fingers, mutated hands, poorly drawn hands, poorly drawn face, mutation, deformed, blurry, dehydrated, bad anatomy, bad proportions, extra limbs, cloned face, disfigured, gross proportions, malformed limbs, missing arms, missing legs, extra arms, extra legs, fused fingers, too many fingers, long neck, username, watermark, signature
    - id: resolution
      label: Resolution
      description: Select the resolution of the output video
      panel: size
      type: select
      default: 720
      options:
      - name: Ultra HD
        value: 1024
      - name: HD
        value: 720
      - name: SD
        value: 480
      - name: Custom
        value: custom
    - id: aspect_ratio
      label: Aspect Ratio
      description: Select the aspect ratio of the output video
      panel: size
      type: select
      default: '1:1'
      options:
      - name: Square
        value: '1:1'
        ratio_w: 1
        ratio_h: 1
      - name: Wide
        value: '16:9'
        ratio_w: 16
        ratio_h: 9
      - name: Vertical
        value: '9:16'
        ratio_w: 9
        ratio_h: 16
      - name: Classic
        value: '4:3'
        ratio_w: 4
        ratio_h: 3
      - name: Custom
        value: custom
    - id: num_inference_steps
      label: Inference Steps
      description: Number of denoising steps
      type: number+slider
      value_type: integer
      panel: sampling
      default: 4
      min: 1
      max: 100
      step: 1
    - id: height
      label: Height
      description: Explicit height override
      type: number
      value_type: integer
      panel: size
      default: 704
      min: 256
      max: 8192
      step: 32
    - id: width
      label: Width
      description: Explicit width override
      type: number
      value_type: integer
      panel: size
      default: 1280
      min: 256
      max: 8192
      step: 32
    - id: seed
      label: Seed
      description: Random seed for reproducibility
      type: random
      default: -1
      min: 0
      max: 4294967295
      value_type: integer
      panel: sampling
      required: false
    - id: guidance_scale
      label: Guidance Scale
      description: Guidance scale for the model
      type: number+slider
      value_type: float
      panel: sampling
      required: false
      default: 1.0
      min: 1.0
      max: 15.0
      step: 0.5
    - id: rope_on_cpu
      label: Rope Frequency on CPU
      description: Keep RoPE frequency tables on CPU to save VRAM; small slices are
        moved to GPU only when needed.
      type: boolean
      panel: chunking_profile
      default: false
      required: false
    - id: chunking_profile
      label: Chunking Profile
      description: Spliting tensors into smaller chunks to reduce memory usage.
      type: select
      panel: chunking_profile
      default: balanced
      options:
      - name: None
        value: none
      - name: Light
        value: light
      - name: Balanced
        value: balanced
      - name: Aggressive
        value: aggressive
    - id: use_tiny_vae
      label: Use Tiny Wan VAE
      description: Use the tiny Wan VAE model for faster inference.
      type: boolean
      panel: vae
      default: true
      required: false
    - id: vae_tile_sample_min_height
      label: VAE Tile Sample Min Height
      description: The minimum height of the tile sample.
      type: number+slider
      value_type: integer
      panel: vae
      default: 256
      min: 64
      max: 2048
      step: 64
    - id: vae_tile_sample_min_width
      label: VAE Tile Sample Min Width
      description: The minimum width of the tile sample.
      type: number+slider
      value_type: integer
      panel: vae
      default: 256
      min: 64
      max: 2048
      step: 64
    - id: vae_tile_sample_stride_height
      label: VAE Tile Sample Stride Height
      description: The stride height of the tile sample.
      type: number+slider
      value_type: integer
      panel: vae
      default: 192
      min: 48
      max: 2048
      step: 64
    - id: vae_tile_sample_stride_width
      label: VAE Tile Sample Stride Width
      description: The stride width of the tile sample.
      type: number+slider
      value_type: integer
      panel: vae
      default: 192
      min: 48
      max: 2048
      step: 64
