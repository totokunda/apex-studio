api_version: apex/v1
kind: Model
type: video
metadata:
  id: wan-2-2-a14b-smooth-mix-text-to-video
  model: wan
  name: Wan 2.2 A14B Smooth Mix Text to Video
  version: 0.1.2
  description: Wan 2.2 A14B Smooth Mix is a 14B parameter model for text-to-video
    generation.
  tags:
  - wan
  - t2v
  - smooth-mix
  - 14b
  - '2.2'
  author: Wan-AI
  license: Apache-2.0
  demo_path: models/wan-2.2-smooth-mix-text-to-video.mp4
  categories:
  - text-to-video
spec:
  engine: wan
  model_type: t2v
  engine_type: torch
  denoise_type: moe
  default_duration_secs: 5.0
  fps: 16
  compute_requirements:
    min_cuda_compute_capability: 7.5
    supported_compute_types:
    - cuda
    - cpu
    - metal
  attention_types:
  - sdpa
  - flash
  - flash3
  - sage
  - metal_flash
  - efficient_dot_product_attention
  loras:
  - source: lightx2v/Wan2.2-Distill-Loras/wan2.2_t2v_A14b_high_noise_lora_rank64_lightx2v_4step_1217.safetensors
    scale: 1.0
    verified: true
    name: high_noise_lightning_lora
    label: High Noise Lightning LoRA
    component: high_noise_transformer
  - source: lightx2v/Wan2.2-Distill-Loras/wan2.2_t2v_A14b_low_noise_lora_rank64_lightx2v_4step_1217.safetensors
    scale: 1.0
    verified: true
    name: low_noise_lightning_lora
    label: Low Noise Lightning LoRA
    component: low_noise_transformer
  components:
  - type: scheduler
    label: Scheduler
    default: Beta57Scheduler
    scheduler_manifest: schedulers/flow_matching.yml
    scheduler_config_defaults:
      num_train_timesteps: 1000
      shift: 3.0
      sigma_max: 1.0
      sigma_min: 0.002994011976047904
  - type: vae
    label: WAN VAE
    name: vae
    base: wan
    config_id: Wan2.2-I2V/vae
    model_path:
    - path: totoku/apex-models/Wan2.2-I2V/vae/vae-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 253806934
      resource_requirements:
        min_vram_gb: 11
        recommended_vram_gb: 15
  - type: text_encoder
    label: WAN Text Encoder
    base: UMT5EncoderModel
    offloading_module: encoder
    config_id: Wan2.1-T2V/text_encoder
    model_path:
    - path: totoku/apex-models/Wan2.1-T2V/text_encoder/text_encoder-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 11361851224
      resource_requirements:
        min_vram_gb: 17
        recommended_vram_gb: 23
    - path: totoku/apex-models/Wan2.1-T2V/text_encoder/text_encoder-fp8_e4m3fn.safetensors
      variant: FP8
      precision: fp8_e4m3fn
      type: safetensors
      file_size: 6731313000
      resource_requirements:
        min_vram_gb: 15
        recommended_vram_gb: 20
    - path: totoku/apex-models/Wan2.1-T2V/text_encoder/text_encoder-q8_0.gguf
      variant: Q8
      precision: q8_0
      type: gguf
      file_size: 7027437536
      resource_requirements:
        min_vram_gb: 14
        recommended_vram_gb: 19
    tokenizer_class: T5Tokenizer
    tokenizer_name: totoku/apex-models
    tokenizer_kwargs:
      subfolder: Wan2.1-T2V/tokenizer
  - type: transformer
    label: High Noise Transformer
    name: high_noise_transformer
    base: wan.base
    config_id: Wan2.2-SmoothMix-T2V/high_noise_transformer
    model_path:
    - path: totoku/apex-models/Wan2.2-SmoothMix-T2V/high_noise_transformer/transformer-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 28577096680
      resource_requirements:
        min_vram_gb: 30
        recommended_vram_gb: 40
    - path: totoku/apex-models/Wan2.2-SmoothMix-T2V/high_noise_transformer/transformer-fp8_e4m3fn.safetensors
      variant: FP8
      precision: fp8_e4m3fn
      type: safetensors
      file_size: 14478698204
      resource_requirements:
        min_vram_gb: 22
        recommended_vram_gb: 30
    - path: totoku/apex-models/Wan2.2-SmoothMix-T2V/high_noise_transformer/transformer-q8_0.gguf
      variant: Q8
      precision: q8_0
      type: gguf
      file_size: 15359771168
      resource_requirements:
        min_vram_gb: 21
        recommended_vram_gb: 28
    - path: totoku/apex-models/Wan2.2-SmoothMix-T2V/high_noise_transformer/transformer-q6_k.gguf
      variant: Q6
      precision: q6_k
      type: gguf
      file_size: 11945307168
      resource_requirements:
        min_vram_gb: 16
        recommended_vram_gb: 22
    - path: totoku/apex-models/Wan2.2-SmoothMix-T2V/high_noise_transformer/transformer-q4_k_m.gguf
      variant: Q4
      precision: q4_k_m
      type: gguf
      file_size: 8310555168
      resource_requirements:
        min_vram_gb: 12
        recommended_vram_gb: 16
  - type: transformer
    label: Low Noise Transformer
    name: low_noise_transformer
    base: wan.base
    config_id: Wan2.2-SmoothMix-T2V/low_noise_transformer
    model_path:
    - path: totoku/apex-models/Wan2.2-SmoothMix-T2V/low_noise_transformer/transformer-bf16.safetensors
      variant: default
      precision: bf16
      type: safetensors
      file_size: 28577096680
      resource_requirements:
        min_vram_gb: 30
        recommended_vram_gb: 40
    - path: totoku/apex-models/Wan2.2-SmoothMix-T2V/low_noise_transformer/transformer-fp8_e4m3fn.safetensors
      variant: FP8
      precision: fp8_e4m3fn
      type: safetensors
      file_size: 14478698204
      resource_requirements:
        min_vram_gb: 22
        recommended_vram_gb: 30
    - path: totoku/apex-models/Wan2.2-SmoothMix-T2V/low_noise_transformer/transformer-q8_0.gguf
      variant: Q8
      precision: q8_0
      type: gguf
      file_size: 15359771168
      resource_requirements:
        min_vram_gb: 21
        recommended_vram_gb: 28
    - path: totoku/apex-models/Wan2.2-SmoothMix-T2V/low_noise_transformer/transformer-q6_k.gguf
      variant: Q6
      precision: q6_k
      type: gguf
      file_size: 11945307168
      resource_requirements:
        min_vram_gb: 16
        recommended_vram_gb: 22
    - path: totoku/apex-models/Wan2.2-SmoothMix-T2V/low_noise_transformer/transformer-q4_k_m.gguf
      variant: Q4
      precision: q4_k_m
      type: gguf
      file_size: 8310555168
      resource_requirements:
        min_vram_gb: 12
        recommended_vram_gb: 16
  defaults:
    run:
      num_inference_steps: 4
      guidance_scale: 5.0
      return_latents: false
      timesteps_as_indices: true
      boundary_ratio: 0.875
      expand_timesteps: false
      text_encoder_kwargs:
        use_attention_mask: true
      attention_kwargs: {}
      vae_tile_sample_min_height: 256
      vae_tile_sample_min_width: 256
      vae_tile_sample_stride_height: 192
      vae_tile_sample_stride_width: 192
  ui:
    panels:
    - name: prompting
      label: Prompting
      collapsible: true
      default_open: true
      layout:
        flow: column
        rows:
        - - prompt
    - name: advanced_prompting
      label: Advanced Prompting
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - negative_prompt
    - name: size
      label: Size
      collapsible: true
      default_open: true
      layout:
        flow: column
        rows:
        - - resolution
        - - aspect_ratio
        - - height
          - width
    - name: sampling
      label: Sampling
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - num_inference_steps
        - - high_noise_guidance_scale
        - - low_noise_guidance_scale
        - - seed
        - - boundary_ratio
    - name: chunking_profile
      label: Chunking Profile
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - chunking_profile
        - - rope_on_cpu
    - name: vae
      label: VAE / Memory
      collapsible: true
      default_open: false
      layout:
        flow: column
        rows:
        - - vae_tile_sample_min_height
        - - vae_tile_sample_min_width
        - - vae_tile_sample_stride_height
        - - vae_tile_sample_stride_width
    inputs:
    - id: prompt
      label: Prompt
      description: Describe the image you want to generate.
      placeholder: A beautiful landscape at golden hour.
      type: text
      panel: prompting
      required: true
    - id: negative_prompt
      label: Negative Prompt
      description: Describe what to avoid in the generation.
      placeholder: blurry, low quality, distorted, artifacts
      type: text
      panel: advanced_prompting
      required: false
      default: lowres, text, error, cropped, worst quality, low quality, jpeg artifacts,
        ugly, duplicate, morbid, mutilated, out of frame, extra fingers, mutated hands,
        poorly drawn hands, poorly drawn face, mutation, deformed, blurry, dehydrated,
        bad anatomy, bad proportions, extra limbs, cloned face, disfigured, gross
        proportions, malformed limbs, missing arms, missing legs, extra arms, extra
        legs, fused fingers, too many fingers, long neck, username, watermark, signature
    - id: resolution
      label: Resolution
      description: Select the resolution of the output image
      panel: size
      type: select
      default: 720
      options:
      - name: HD
        value: 720
      - name: SD
        value: 480
      - name: Custom
        value: custom
    - id: aspect_ratio
      label: Aspect Ratio
      description: Select the aspect ratio of the output image
      panel: size
      type: select
      default: '1:1'
      options:
      - name: Square
        value: '1:1'
        ratio_w: 1
        ratio_h: 1
      - name: Wide
        value: '16:9'
        ratio_w: 16
        ratio_h: 9
      - name: Vertical
        value: '9:16'
        ratio_w: 9
        ratio_h: 16
      - name: Classic
        value: '4:3'
        ratio_w: 4
        ratio_h: 3
      - name: Custom
        value: custom
    - id: num_inference_steps
      label: Inference Steps
      description: Number of denoising steps
      type: number+slider
      value_type: integer
      panel: sampling
      default: 4
      min: 1
      max: 100
      step: 1
    - id: height
      label: Height
      description: Explicit height override
      type: number
      value_type: integer
      panel: size
      default: 480
      min: 256
      max: 8192
      step: 16
    - id: width
      label: Width
      description: Explicit width override
      type: number
      value_type: integer
      panel: size
      default: 832
      min: 256
      max: 8192
      step: 16
    - id: seed
      label: Seed
      description: Random seed for reproducibility
      type: random
      default: -1
      min: 0
      max: 4294967295
      value_type: integer
      panel: sampling
      required: false
    - id: high_noise_guidance_scale
      label: High Noise Guidance Scale
      type: number
      value_type: float
      panel: sampling
      required: false
      default: 1.0
      min: 1.0
      max: 15.0
      step: 0.1
    - id: low_noise_guidance_scale
      label: Low Noise Guidance Scale
      type: number
      value_type: float
      panel: sampling
      required: false
      default: 1.0
      min: 1.0
      max: 15.0
      step: 0.1
    - id: boundary_ratio
      label: Boundary Ratio
      description: The ratio of the boundary of the image
      type: number+slider
      value_type: float
      panel: sampling
      required: false
      default: 0.875
      min: 0.0
      max: 1.0
      step: 0.01
    - id: chunking_profile
      label: Chunking Profile
      description: Spliting tensors into smaller chunks to reduce memory usage.
      type: select
      panel: chunking_profile
      default: light
      options:
      - name: None
        value: none
      - name: Light
        value: light
      - name: Balanced
        value: balanced
      - name: Aggressive
        value: aggressive
    - id: rope_on_cpu
      label: Rope Frequency on CPU
      description: Keep RoPE frequency tables on CPU to save VRAM; small slices are
        moved to GPU only when needed.
      type: boolean
      panel: chunking_profile
      default: false
      required: false
    - id: vae_tile_sample_min_height
      label: VAE Tile Min Height
      description: Minimum pixel height before spatial tiling is used.
      type: number+slider
      value_type: integer
      panel: vae
      default: 256
      min: 256
      max: 2048
      step: 64
    - id: vae_tile_sample_min_width
      label: VAE Tile Min Width
      description: Minimum pixel width before spatial tiling is used.
      type: number+slider
      value_type: integer
      panel: vae
      default: 256
      min: 256
      max: 2048
      step: 64
    - id: vae_tile_sample_stride_height
      label: VAE Tile Stride Height
      description: Stride height for spatial tiling.
      type: number+slider
      value_type: integer
      panel: vae
      default: 192
      min: 64
      max: 2048
      step: 64
    - id: vae_tile_sample_stride_width
      label: VAE Tile Stride Width
      description: Stride width for spatial tiling.
      type: number+slider
      value_type: integer
      panel: vae
      default: 192
      min: 64
      max: 2048
      step: 64
